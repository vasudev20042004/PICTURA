<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Pictura Creations Ltd.</title>
    <!-- CSS & Fonts -->
    <link rel="icon" href="assets/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .gallery-header {
            padding: 8rem 0 4rem;
            text-align: center;
        }

        .gallery-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        /* Masonry Layout */
        .gallery-grid {
            column-count: 2;
            column-gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                column-count: 1;
            }
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: var(--border-radius);
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="topo-bg"></div>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><img src="assets/pictura.png" alt="Pictura Creations"
                        style="height: 90px; object-fit: contain;"></a>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="gallery-header">
            <h1>Our Works</h1>
            <p style="color:var(--text-muted);">A showcase of our cinematic journey.</p>
        </div>





        <div id="youtube-section-gallery" class="youtube-section">
            <div id="dynamic-uploads-container" style="display: none;">
                <div class="youtube-header">
                    <h3>Latest Uploads</h3>
                    <p style="color:var(--text-muted); font-size:0.9rem;">Fresh from our channel</p>
                </div>
                <div id="youtube-gallery-grid" class="youtube-grid">
                    <!-- JS will inject videos here -->
                </div>
            </div>

            <!-- YouTube Playlist Section -->
            <div class="youtube-playlist-section">
                <h2>More From Our YouTube Channel</h2>
                <p>Watch all our recent creative highlights</p>
                <div class="playlist-container">
                    <iframe src="https://www.youtube.com/embed/videoseries?list=PLkapcJk6Xjolml-WEfdbadhraL8mn44Yl"
                        title="YouTube playlist player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>

        <div class="gallery-grid" id="gallery-grid">
            <!-- Add new gallery items here later -->
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="">
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Pictura Creations Ltd.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/youtube.js"></script>
    <script>


        // Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.lightbox-close');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>

</html>
